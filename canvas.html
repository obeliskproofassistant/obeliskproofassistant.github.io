<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Canvas - fillRect()</title>
  <style>
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    :root {
      --primary-color: #FFD700; /* gold */
      --primary-color-dark: color-mix(in srgb, var(--primary-color), black 80%);
      --primary-color-light: color-mix(in srgb, var(--primary-color), white 80%);
    }

    .button {
      background: var(--primary-color);
    }

    .button:hover {
      background: var(--primary-color-dark);
    }
  </style>
</head>
<body>
  <h1>HTML5 Canvas - fillRect()</h1>

  <canvas id="myCanvas" width="16" height="16" style="border:1px solid black; width: 256px; height: 256px;">
    Sorry, your browser does not support canvas.
  </canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    const rootElement = document.documentElement;
    const rootStyles = getComputedStyle(rootElement);
    const myColor = rootStyles.getPropertyValue('--primary-color-dark').trim();

    ctx.fillStyle = myColor;
    ctx.fillRect(0, 0, 16, 16);
    ctx.stroke();
  </script>
</body>
</html>
