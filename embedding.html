<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obelisk Interactive Demonstration</title>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']],
          packages: {'[+]': ['ams', 'color', 'noerrors', 'noundefined']}
        },
        startup: { typeset: true }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #f8fafc;
            background-color: #030712;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        #nav-toolbar {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            font-size: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #fff;
        }

        #content-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        #myhtmloutput {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
        }

        /* Adjust pre formatting inside output */
        #myhtmloutput pre {
            font-size: 13.5px !important;
            line-height: 1.5 !important;
            font-family: 'JetBrains Mono', monospace !important;
            overflow-x: auto;
        }
        /* Ensure links in both Unicode and MathJax LaTeX mode inherit syntax-highlighting colors */
        a.sym-link, .formula-latex a, mjx-container a {
            all: unset;
            cursor: pointer;
            color: inherit !important;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: rgba(56, 189, 248, 0.55);
            text-underline-offset: 3px;
            border-radius: 3px;
            transition: background 0.12s ease, text-decoration-color 0.12s ease;
        }
        a.sym-link:hover, .formula-latex a:hover, mjx-container a:hover {
            background: rgba(56, 189, 248, 0.22);
            text-decoration-style: solid;
            text-decoration-color: #38bdf8;
        }
        body.hide-latex .row-latex, body.hide-latex .formula-latex { display: none !important; }
        body.hide-unicode .row-unicode, body.hide-unicode .formula-unicode { display: none !important; }
        body.hide-ansii .row-ansii, body.hide-ansii .formula-ansii { display: none !important; }
        body.hide-schemata .row-scheme { display: none !important; }
    </style>
</head>
<body>

<div id="nav-toolbar">
    <div class="toolbar-title">
        <span>⚡ Obelisk Kernel Output</span>
        <span style="font-size: 10px; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 1px 6px; border-radius: 4px;">Verified High-Assurance</span>
    </div>
    <div class="toolbar-nav">
        <button class="toolbar-btn" onclick="scrollToText('1. Propositional Logic')">1. Propositional Logic</button>
        <button class="toolbar-btn" onclick="scrollToText('2. Predicate Logic')">2. Predicate Logic</button>
        <button class="toolbar-btn" onclick="scrollToText('3. Set/Class Foundations')">3. Set/Class Foundations</button>
        <button class="toolbar-btn" onclick="scrollToText('4. Metalogical Laws')">4. Metalogical Laws</button>
        <button class="toolbar-btn" onclick="scrollToText('5. Incompleteness')">5. Incompleteness</button>
        <a class="toolbar-btn" href="generated/manual.html" target="_blank">📖 Open Full Manual</a>
        <a class="toolbar-btn" href="generated/theory_db.json" target="_blank">🗄️ JSON DB</a>
    </div>
</div>

<div id="content-container">
    <div id="myhtmloutput">
        <div style="padding: 30px; text-align: center; color: #94a3b8;">
            Loading verified mathematical output...
        </div>
    </div>
</div>

<script>
const localAddr = "generated/output.html?v=20261105a";
const remoteAddr = "generated/manual.html";

try {
    sessionStorage.clear();
} catch (e) {}

function rewriteRelativeAnchors(rootEl) {
    if (!rootEl) return;
    const anchors = rootEl.querySelectorAll("a[href]");
    for (const a of anchors) {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("#") || href.startsWith("http:") || href.startsWith("https:") || href.startsWith("mailto:") || href.startsWith("generated/")) {
            continue;
        }
        if (href.startsWith("../")) {
            a.setAttribute("href", href.slice(3));
        } else {
            a.setAttribute("href", "generated/" + href);
        }
    }
}

function rewriteLatexHrefs(htmlStr) {
    return htmlStr.replace(/\\href\{([^}]+)\}/g, function(match, href) {
        if (!href || href.startsWith("#") || href.startsWith("http:") || href.startsWith("https:") || href.startsWith("mailto:") || href.startsWith("generated/")) {
            return match;
        }
        if (href.startsWith("../")) {
            return "\\href{" + href.slice(3) + "}";
        }
        return "\\href{generated/" + href + "}";
    });
}

function toggleFormatHide(fmt) {
    const cls = 'hide-' + fmt;
    const isHidden = document.body.classList.toggle(cls);
    const btn = document.getElementById('btn-hide-' + fmt);
    if (btn) btn.classList.toggle('active', isHidden);
    if (!isHidden && fmt === 'latex' && window.MathJax && window.MathJax.typesetPromise) {
        const target = document.getElementById("myhtmloutput");
        window.MathJax.typesetPromise(target ? [target] : undefined).then(() => {
            rewriteRelativeAnchors(target);
        }).catch(err => console.warn("MathJax typeset warning:", err));
    }
}
window.toggleFormatHide = toggleFormatHide;

function toggleSchemataHide() {
    const isHidden = document.body.classList.toggle('hide-schemata');
    const btn = document.getElementById('btn-hide-schemata');
    if (btn) btn.classList.toggle('active', isHidden);
}
window.toggleSchemataHide = toggleSchemataHide;

function setFormatMode(mode) {
    document.body.classList.remove('mode-unicode', 'mode-latex');
    document.body.classList.add('mode-' + mode);
    const btnUni = document.getElementById('btn-unicode');
    const btnLtx = document.getElementById('btn-latex');
    if (btnUni) btnUni.classList.toggle('active', mode === 'unicode');
    if (btnLtx) btnLtx.classList.toggle('active', mode === 'latex');
    if (mode === 'latex' && window.MathJax && window.MathJax.typesetPromise) {
        const target = document.getElementById("myhtmloutput");
        window.MathJax.typesetPromise(target ? [target] : undefined).then(() => {
            rewriteRelativeAnchors(target);
        }).catch(err => console.warn("MathJax typeset warning:", err));
    }
}
window.setFormatMode = setFormatMode;

async function getText() {
    try {
        const res = await fetch(localAddr, { cache: "no-store" });
        if (res.ok) {
            return await res.text();
        }
        throw new Error("Local fetch failed: " + res.status);
    } catch (err) {
        console.warn("Falling back to manual URL due to:", err);
        const remoteRes = await fetch(remoteAddr, { cache: "no-store" });
        return await remoteRes.text();
    }
}

function scrollTargetIntoContainer(targetEl) {
    if (!targetEl) return;
    targetEl.style.scrollMarginTop = '64px';
    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const toolbar = document.getElementById("nav-toolbar");
    const toolbarHeight = toolbar ? toolbar.offsetHeight : 44;
    const rect = targetEl.getBoundingClientRect();
    const targetTop = Math.max(0, window.pageYOffset + rect.top - toolbarHeight - 14);
    window.scrollTo({ top: targetTop, behavior: 'smooth' });
    targetEl.style.outline = '2px solid #38bdf8';
    targetEl.style.backgroundColor = 'rgba(56, 189, 248, 0.22)';
    setTimeout(() => {
        targetEl.style.outline = 'none';
        targetEl.style.backgroundColor = '';
    }, 2000);
}

function scrollToText(searchText) {
    const el = document.getElementById("myhtmloutput");
    if (!el) return;
    const secMatch = /^\s*([1-6])\s*[.)]/.exec(searchText);
    if (secMatch) {
        const byId = el.querySelector("#sec-" + secMatch[1]);
        if (byId) {
            scrollTargetIntoContainer(byId);
            return;
        }
    }
    const needle = searchText.toLowerCase();
    const nodes = el.querySelectorAll("h1, h2, h3, section, span, p, pre, td, a");
    let best = null;
    let bestLen = Infinity;
    for (let s of nodes) {
        const text = (s.textContent || '').toLowerCase();
        if (text.includes(needle) && text.length < bestLen) {
            best = s;
            bestLen = text.length;
        }
    }
    if (!best) {
        const words = needle.split(/\s+/);
        for (let s of nodes) {
            const hay = (s.textContent || '').toLowerCase();
            if (words.length && words.every(w => hay.includes(w)) && hay.length < bestLen) {
                best = s;
                bestLen = hay.length;
            }
        }
    }
    if (best) {
        scrollTargetIntoContainer(best);
        return;
    }
    console.warn("scrollToText: no match for", searchText);
}

async function renderOutput() {
    try {
        const rawHtml = await getText();
        const target = document.getElementById("myhtmloutput");
        target.innerHTML = rewriteLatexHrefs(rawHtml);
        // Rewrite relative links originating from generated/output.html so they resolve from root embedding.html
        rewriteRelativeAnchors(target);
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([target]).then(() => {
                rewriteRelativeAnchors(target);
            }).catch(err => console.warn("MathJax typeset warning:", err));
        } else {
            const mjScript = document.getElementById("MathJax-script");
            if (mjScript) {
                mjScript.addEventListener("load", () => {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([target]).then(() => {
                            rewriteRelativeAnchors(target);
                        }).catch(err => console.warn("MathJax typeset warning:", err));
                    }
                });
            }
        }
        target.addEventListener("click", function(ev) {
            const link = ev.target.closest ? ev.target.closest('a[href*="#item-"], a[href*="#sec-"]') : null;
            if (link) {
                const href = link.getAttribute("href") || "";
                const hashIdx = href.indexOf("#");
                if (hashIdx !== -1) {
                    const idStr = href.slice(hashIdx + 1);
                    const dest = document.getElementById(idStr);
                    if (dest && target.contains(dest)) {
                        ev.preventDefault();
                        scrollTargetIntoContainer(dest);
                    }
                }
            }
        });
    } catch (e) {
        document.getElementById("myhtmloutput").innerHTML = 
            "<div style='color:#ef4444; padding:20px;'>Failed to load output: " + e.message + "</div>";
    }
}

renderOutput();
</script>

</body>
</html>
