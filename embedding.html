<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obelisk Interactive Demonstration</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #f8fafc;
            background-color: #030712;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        #nav-toolbar {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            font-size: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #fff;
        }

        #content-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        #myhtmloutput {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Adjust pre formatting inside output */
        #myhtmloutput pre {
            font-size: 13.5px !important;
            line-height: 1.5 !important;
            font-family: 'JetBrains Mono', monospace !important;
        }
    </style>
</head>
<body>

<div id="nav-toolbar">
    <div class="toolbar-title">
        <span>⚡ Obelisk Kernel Output</span>
        <span style="font-size: 10px; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 1px 6px; border-radius: 4px;">Verified High-Assurance</span>
    </div>
    <div class="toolbar-nav">
        <button class="toolbar-btn" onclick="scrollToText('1) Propositional logic')">1. Propositional Logic</button>
        <button class="toolbar-btn" onclick="scrollToText('2) Predicate logic')">2. First-Order Logic</button>
        <button class="toolbar-btn" onclick="scrollToText('3) Set/class-theoretic foundations')">3. Class Axioms</button>
        <a class="toolbar-btn" href="output.pdf" target="_blank">📄 View PDF</a>
        <a class="toolbar-btn" href="output_white.pdf" target="_blank">📄 Light PDF</a>
    </div>
</div>

<div id="content-container">
    <div id="myhtmloutput">
        <div style="padding: 30px; text-align: center; color: #94a3b8;">
            Loading verified mathematical output...
        </div>
    </div>
</div>

<script>
const localAddr = "output.html";
const remoteAddr = "https://raw.githubusercontent.com/georgydunaev/variousreleases/refs/heads/main/output.html";

async function getText() {
    let text = sessionStorage.getItem("obelisk_demo_output_v2");
    if (!text) {
        try {
            const res = await fetch(localAddr);
            if (res.ok) {
                text = await res.text();
            } else {
                throw new Error("Local fetch failed: " + res.status);
            }
        } catch (err) {
            console.warn("Falling back to remote URL due to:", err);
            const remoteRes = await fetch(remoteAddr);
            text = await remoteRes.text();
        }
        if (text) {
            sessionStorage.setItem("obelisk_demo_output_v2", text);
        }
    }
    return text;
}

function scrollToText(searchText) {
    const el = document.getElementById("myhtmloutput");
    if (!el) return;
    const needle = searchText.toLowerCase();
    const spans = el.querySelectorAll("span, p, pre");
    // Pick the MOST SPECIFIC match (smallest text content) instead of the first:
    // output.html wraps the entire document in one <pre> whose text contains every
    // section header, so first-match order would always hit that giant wrapper.
    let best = null;
    let bestLen = Infinity;
    for (let s of spans) {
        const text = (s.textContent || '').toLowerCase();
        if (text.includes(needle) && text.length < bestLen) {
            best = s;
            bestLen = text.length;
        }
    }
    if (!best) {
        // Fallback: match partial words inside longer headers (e.g. "class axioms" -> "Class Axiom (...)")
        const words = needle.split(/\s+/);
        for (let s of spans) {
            const hay = (s.textContent || '').toLowerCase();
            if (words.length && words.every(w => hay.includes(w)) && hay.length < bestLen) {
                best = s;
                bestLen = hay.length;
            }
        }
    }
    if (best) {
        best.scrollIntoView({ behavior: 'smooth', block: 'center' });
        best.style.outline = '2px solid #38bdf8';
        setTimeout(() => { best.style.outline = 'none'; }, 2000);
        return;
    }
    console.warn("scrollToText: no match for", searchText);
}

async function renderOutput() {
    try {
        const rawHtml = await getText();
        const target = document.getElementById("myhtmloutput");
        target.innerHTML = rawHtml;
    } catch (e) {
        document.getElementById("myhtmloutput").innerHTML = 
            "<div style='color:#ef4444; padding:20px;'>Failed to load output: " + e.message + "</div>";
    }
}

renderOutput();
</script>

</body>
</html>
