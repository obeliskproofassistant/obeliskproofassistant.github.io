    <script>
    function getScrollPosition() {
        return window.scrollY !== undefined ? window.scrollY : (window.pageYOffset || document.documentElement.scrollTop || 0);
    }

    function scrollToTheoryOutline() {
        var rightPane = document.getElementById('right-pane');
        if (rightPane) {
            var targetY = rightPane.getBoundingClientRect().top + getScrollPosition();
            window.scrollTo({
                top: targetY,
                behavior: 'smooth'
            });
        }
    }

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function updateMobileNavState() {
        var rightPane = document.getElementById('right-pane');
        var jumpTheory = document.getElementById('mobile-jump-theory-btn');
        var jumpTop = document.getElementById('mobile-jump-top-btn');
        if (rightPane && jumpTheory && jumpTop) {
            var currentY = getScrollPosition();
            if (currentY >= (rightPane.offsetTop - 60)) {
                jumpTheory.style.display = 'none';
                jumpTop.style.display = 'inline-flex';
            } else {
                jumpTheory.style.display = 'inline-flex';
                jumpTop.style.display = 'none';
            }
        }
    }

    window.addEventListener('scroll', updateMobileNavState, { passive: true });
    window.addEventListener('resize', updateMobileNavState);
    document.addEventListener('DOMContentLoaded', updateMobileNavState);

    function toggleMobileHeaderMenu() {
        var nav = document.getElementById('portal-nav-actions');
        var btn = document.getElementById('mobile-header-toggle-btn');
        if (nav && btn) {
            var isOpen = nav.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            btn.innerHTML = isOpen ? 'Close' : 'Buttons';
        }
    }
    </script>
