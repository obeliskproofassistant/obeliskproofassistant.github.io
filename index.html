<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <!--(no title)-->
    <title>
    OPA
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.indexbody {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        #portal-switch-banner {
            height: 40px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        .portal-brand {
            font-weight: 700;
            font-size: 13.5px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .portal-tag {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .switch-link {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .switch-link:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
        }

        .split-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 40px);
        }
        .split-container .left {
            width: 50%;
            height: 100%;
        }
        .split-container .right {
            width: 50%;
            height: 100%;
            color: white;
            background-color: black;
        }
        iframe.completeiframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
    <!-- not "assets/vendor/silktide-consent-manager/..." because submodules not working -->
    <link rel="stylesheet" href="assets/silktide-consent-manager.css">
    <script src="assets/silktide-consent-manager.js"></script>
    <link rel="shortcut icon" type="image/x-icon" href="/images/myfavicon.ico"/>
</head>
<body class="indexbody">
    <header id="portal-switch-banner">
        <div class="portal-brand">
            <span>Obelisk Proof Assistant</span>
            <span class="portal-tag">🏛 Classic 2-Pane View</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <a href="proofs.html" target="_top" class="switch-link">
                📜 Proofs Gallery &rarr;
            </a>
            <a href="obelisk_ai.html" target="_top" class="switch-link">
                ✨ Switch to Modern AI Portal &rarr;
            </a>
        </div>
    </header>
    <script>
    // Initialize the consent manager
    window.silktideConsentManager.init({
      consentTypes: [
        {
          id: 'essential',
          label: 'Essential',
          description: 'These are necessary for the website to function and cannot be switched off.',
          required: true,
        },
        {
          id: 'analytics',
          label: 'Analytics',
          description: 'These help us understand how visitors interact with the website.',
          defaultValue: true,
          gtag: 'analytics_storage', // Automatic Google Tag Manager / Silktide Analytics integration
        },
        {
          id: 'marketing',
          label: 'Marketing',
          description: 'These are used to deliver personalized advertisements.',
          defaultValue: false,
          gtag: ['ad_storage', 'ad_user_data', 'ad_personalization'],
          onAccept: function() {
            console.log('Marketing accepted');
          },
          onReject: function() {
            console.log('Marketing rejected');
          },
        },
      ],
    });
    </script>


    <script>
window.addEventListener('message', function(event) {
    // Optional: Verify origin for security
    // if (event.origin !== "https://trusted-site.com") return;
    
    if (event.data.type === 'CHANGE_TITLE') {
        document.title = event.data.title;
    }
});
    </script>

    <div class="split-container">
        <div class="left">
            <iframe class="completeiframe" src="about.html"></iframe>
        </div>
        <div class="right">
            <iframe class="completeiframe" src="embedding.html"></iframe>
        </div>
    </div>

</body>
</html>
