    <script>
      // Anti-recursion guard: Obelisk Portal must never recursively nest inside an iframe
      if (window.self !== window.top) {
        try {
          window.top.location.href = window.location.href;
        } catch (e) {
          // If cross-origin prevented direct top location access, avoid framing
          console.warn("Obelisk portal detected nested framing:", e);
        }
      }

      function applyObeliskTheme(theme) {
        var isDark = (theme !== 'light');
        if (isDark) {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.classList.remove('light-mode');
        } else {
          document.documentElement.classList.remove('dark-mode');
          document.documentElement.classList.add('light-mode');
        }
      }
      try {
        var savedTheme = localStorage.getItem('opa_left_theme');
        if (savedTheme === 'light') {
          applyObeliskTheme('light');
        } else if (savedTheme === 'dark') {
          applyObeliskTheme('dark');
        } else {
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          applyObeliskTheme(prefersLight ? 'light' : 'dark');
        }
      } catch (e) {
        applyObeliskTheme('dark');
      }
    </script>

    <script>
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'LEFT_THEME_CHANGED') {
        applyObeliskTheme(event.data.isDark ? 'dark' : 'light');
    } else if (event.data && event.data.type === 'CHANGE_TITLE') {
        document.title = event.data.title;
    }
});

    <script>
    function getScrollPosition() {
        return window.scrollY !== undefined ? window.scrollY : (window.pageYOffset || document.documentElement.scrollTop || 0);
    }

    function scrollToTheoryOutline() {
        var rightPane = document.getElementById('right-pane');
        if (rightPane) {
            var targetY = rightPane.getBoundingClientRect().top + getScrollPosition();
            window.scrollTo({
                top: targetY,
                behavior: 'smooth'
            });
        }
    }

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function updateMobileNavState() {
        var rightPane = document.getElementById('right-pane');
        var jumpTheory = document.getElementById('mobile-jump-theory-btn');
        var jumpTop = document.getElementById('mobile-jump-top-btn');
        if (rightPane && jumpTheory && jumpTop) {
            var currentY = getScrollPosition();
            if (currentY >= (rightPane.offsetTop - 60)) {
                jumpTheory.style.display = 'none';
                jumpTop.style.display = 'inline-flex';
            } else {
                jumpTheory.style.display = 'inline-flex';
                jumpTop.style.display = 'none';
            }
        }
    }

    window.addEventListener('scroll', updateMobileNavState, { passive: true });
    window.addEventListener('resize', updateMobileNavState);
    document.addEventListener('DOMContentLoaded', updateMobileNavState);

    function toggleMobileHeaderMenu() {
        var nav = document.getElementById('portal-nav-actions');
        var btn = document.getElementById('mobile-header-toggle-btn');
        if (nav && btn) {
            var isOpen = nav.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            btn.innerHTML = isOpen ? 'Close' : 'Buttons';
        }
    }
    </script>
